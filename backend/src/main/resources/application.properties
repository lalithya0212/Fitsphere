# ===================================================================
# FitSphere — Phase 1 Backend Configuration
# ===================================================================

# Application Information
spring.application.name=fitsphere-backend
server.port=${SERVER_PORT:8080}

# ===================================================================
# Database (MySQL Connector/J)
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fitsphere}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# JWT (JSON Web Token) Security Settings
# ===================================================================
# Secret must be at least 256 bits (32 bytes) for HS256 / HS384 / HS512
fitsphere.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 Hours in Milliseconds = 86,400,000 ms
fitsphere.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Initial Administrator Account Seed Settings
# ===================================================================
fitsphere.admin.name=Shyam Raj
fitsphere.admin.email=shyamraj@gmail.com
fitsphere.admin.initial-password=${ADMIN_INITIAL_PASSWORD:shyam123}

# ===================================================================
# Springdoc / OpenAPI / Swagger UI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
